server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: sdu-smart-life
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/sdu_smart_life?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info
campus:
  ai:
    enabled: ${CAMPUS_AI_ENABLED:false}
    env-file: ${CAMPUS_AI_ENV_FILE:.env.ai}
    model-dir: ${CAMPUS_AI_MODEL_DIR:.tools/ai}
    qdrant-url: ${CAMPUS_AI_QDRANT_URL:http://127.0.0.1:6333}
    collection: ${CAMPUS_AI_COLLECTION:campus_sdu_e5_v1}
    ingest-on-start: ${CAMPUS_AI_INGEST_ON_START:true}
