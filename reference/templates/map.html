<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>点击地图拾取坐标</title>
    <script charset="utf-8" src="https://map.qq.com/api/gljs?v=1.exp&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77"></script>
    <style type="text/css">
        html,
        body {
            height: 100%;
            margin: 0px;
            padding: 0px;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            top: 80px;
            z-index: 15;
        }

        #info {
            position: absolute;
            left: 20px;
            top: 80px;
            font-size: 14px;
            background: #FFF;
            width: 270px;
            padding: 10px;
            border-radius: 3px;
        }

        /* 上边栏样式 */
        #navbar {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            z-index: 10;
            height: 80px;
        }

        #navbar img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            margin-right: 10px;
        }

        #navbar span {
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body onload="initMap()">
    <!-- 上边栏 -->
    <div id="navbar">
        <img src="{{url_for('static',filename='images/1.png')}}" alt="头像" onclick="goToLogin()">
        <span onclick="goToLogin()">个人名称</span>
    </div>

    <div id="container"></div>
    <div id="info">当前点击坐标为：<span id="position"></span></div>

    <script>
    function goToLogin() {
        window.location.href = '/login';
    }
    </script>

    <script>
        console.log(sda);
        function initMap() {
            var position = document.getElementById("position");
            var center = new TMap.LatLng(36.368459, 120.677931); // 设置中心点坐标
            var map = new TMap.Map("container", {
                center: center,
                zoom: 14 // 设置初始缩放级别
            });

            map.on("click", function (evt) {
                var lat = evt.latLng.getLat().toFixed(6);
                var lng = evt.latLng.getLng().toFixed(6);
                position.innerHTML = lat + "," + lng;

                var poi = evt.poi;
                if (poi) {
                    // 根据poi.name设置不同的图片URL和跳转链接
                    let imageUrl;
                    let linkUrl;
                    var name = poi.name;
                    switch (poi.name) {
                        case "计算机科学与技术学院":
                            imageUrl = "https://www.cs.sdu.edu.cn/images/110.jpg";
                            linkUrl = `/talk?name=${encodeURIComponent(name)}`;
                            break;
                        case "生命科学学院":
                            imageUrl = "https://example.com/image2.jpg";
                            linkUrl = `/talk?name=${encodeURIComponent(name)}`;
                            break;
                        
                        default:
                            imageUrl = "https://mapapi.qq.com/web/lbs/javascriptGL/demo/img/em.jpg";   // 默认图片
                            linkUrl = `/talk?name=${encodeURIComponent(name)}`;
                    }

                    console.log(name);

                    // 创建并显示InfoWindow
                    var infoWindow = new TMap.InfoWindow({
                        map: map,
                        position: poi.latLng,
                        content: `<div>
                                    <img src='${imageUrl}' width='200' height='100'>
                                    <p>${poi.name}</p>
                                    <button onclick="window.location.href='${linkUrl}'">讨论区</button>
                                </div>`
                    }).open();
                } else {
                    // 如果没有拾取到POI，可以关闭之前打开的InfoWindow（如果有的话）
                    // 但在这个例子中，我们每次点击都会创建新的InfoWindow，所以不需要额外关闭逻辑
                }
            });
        }
    </script>
</body>

</html>
