<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户名或密码错误</title>
<script>
function showErrorMessage() {
  alert("用户名或密码错误，请重新尝试！");
  setTimeout(function() {
    window.location.href = '/login'; // 替换成你的登录页面地址
  }, 100); // 延迟 200 毫秒跳转
}
</script>
</head>
<body onload="showErrorMessage();">
<h1>登录失败</h1>
<p>用户名或密码错误</p>
</body>
</html>
