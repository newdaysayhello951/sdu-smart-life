<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Directory Page</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            height: 100%;
        }
        .fullscreen-bg {
            background-image: url('static/images/sdu.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            margin-top: 60px; /* 与navbar的高度相等 */
        }

        #navbar {
            background-color: #333;
            color: white;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            height: 60px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .nav-links {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
            margin: 0 15px; /* 为链接添加外边距 */
        }

        .nav-links a:hover {
            color: #00aaff;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .user-info img {
            border-radius: 50%;
            cursor: pointer;
            width: 40px;
            height: 40px;
        }

        .user-info .username {
            margin-left: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        .cta-button {
            background-color: #00aaff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 20px;
        }
        .copyright {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: white;
        }
        .no_see{
            color: #333;;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div id="navbar">
        <div class="nav-links">
            <a href="{{url_for('used_goods_trade')}}">二手市场</a>
            <a href="{{url_for('map')}}">校园地图</a>
            <a href="{{url_for('personal_page')}}">个人主页</a>
        </div>
        <script>
            var user_name = "{{user_information['username']}}";
        </script>
        <div class="user-info">
            <img src="{{url_for('static', filename=user_information['profile_picture'] )}}" alt="头像" onclick="goToLogin()">
            <span class="username" onclick="goToLogin()">{{user_information['username']}}</span>
        </div>
    </div>
    <div class="fullscreen-bg">
        <h1>Welcome to DataBase Work</h1>
        <p>山东大学混搭网站</p>
        <a href="{{url_for('login')}}" class="cta-button" id="index_content">Please Login</a>
    </div>
    <div class="copyright">
        &copy; 2023-2024 All rights reserved.
    </div>
    <script>
        function goToLogin() {
            console.log(user_name);
            if(user_name !== '未登录用户'){
                console.log(user_name);
                window.location.href = 'personal_page';
            }
            else{
                console.log(user_name);
                window.location.href = 'login';
            }
            console.log("Go to login page");
        }
    </script>
</body>
<script>
    const userInfo = {{ user_information | tojson }};
    console.log(userInfo['is_login']);
    if (userInfo['is_login']) {
        document.getElementById('index_content').textContent = "退出并重新登录";
    } else {
        document.getElementById('index_content').textContent = "Please Login";
    }
</script>
</html>
