<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易失败提示</title>
<script>
function showSuccessMessage() {
  alert("交易失败（可能是你自己买自己的");
  setTimeout(function() {
    window.location.href = '/used_goods_trade'; // 替换成你的登录页面地址
  }, 100); // 延迟 100 毫秒跳转
}
</script>
</head>
<body onload="showSuccessMessage();">
<h1>交易失败</h1>
<p>交易失败（可能是你自己买自己的</p>
</body>
</html>
