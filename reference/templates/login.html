
<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>plase login in</title>
  <meta name="keywords" content="" />
  <meta name="description" content="" /> 

  <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='css/bootstrap.min.css')}}">
  <link rel="stylesheet" type="text/css" href="https://lib.baomitu.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" type="text/css" href="https://lib.baomitu.com/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/util.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
  <div class="limiter">
    <div class="container-login100",>
      <div class="wrap-login100 p-l-55 p-r-55 p-t-65 p-b-54">
        <form class="login100-form validate-form" action="try_login" method="POST">
          <span class="login100-form-title p-b-49">登录</span>

          <div class="wrap-input100 validate-input m-b-23" data-validate="请输入用户名">
            <span class="label-input100">用户名</span>
            <input class="input100" type="text" name="username" placeholder="请输入用户名" autocomplete="off" required>
            <span class="focus-input100" data-symbol="&#xf206;"></span>
          </div>

          <div class="wrap-input100 validate-input" data-validate="请输入密码">
            <span class="label-input100">密码</span>
            <input class="input100" type="password" name="pass" placeholder="请输入密码" required>
            <span class="focus-input100" data-symbol="&#xf190;"></span>
          </div>

          <div class="text-right p-t-8 p-b-31">
            <a href="javascript:">忘记密码？</a>
          </div>

          <div class="container-login100-form-btn">
            <div class="wrap-login100-form-btn">
              <div class="login100-form-bgbtn"></div>
              <button type="submit" class="login100-form-btn">登 录</button>
            </div>
          </div>

          <div class="txt1 text-center p-t-54 p-b-20">
            <span>第三方登录</span>
          </div>

          <div class="flex-c-m">
            <a href="#" class="login100-social-item bg1">
              <i class="fa fa-wechat"></i>
            </a>

            <a href="#" class="login100-social-item bg2">
              <i class="fa fa-qq"></i>
            </a>

            <a href="#" class="login100-social-item bg3">
              <i class="fa fa-weibo"></i>
            </a>
          </div>

          <div class="flex-col-c p-t-25">
            <button class="txt2" type="button" onclick="submitForm()">立即注册</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/jquery-1.11.1.js') }}"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
  <script>
    function submitForm() {
      // 获取用户名输入框的值
      const username = document.querySelector('input[name="username"]').value;
  
      // 获取密码输入框的值
      const password = document.querySelector('input[name="pass"]').value;
  
      console.log("用户名: " + username);
      console.log("密码: " + password); 
  
      // 创建要发送的数据对象
      const data = {
        username: username,
        password: password
      };
      
      const url = `register?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
  
      // 使用 window.location.href 进行跳转
      window.location.href = url;
    }
  </script> 
</body>

</html>
