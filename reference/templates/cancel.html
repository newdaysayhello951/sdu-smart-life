<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下架成功提示</title>
<script>
function showSuccessMessage() {
  alert("下架成功");
  setTimeout(function() {
    window.location.href = '/personal_page'; // 替换成你的登录页面地址
  }, 100); // 延迟 100 毫秒跳转
}
</script>
</head>
<body onload="showSuccessMessage();">
<h1>商品下架</h1>
<p>页面加载时会自动弹出下架成功提示。</p>
</body>
</html>
