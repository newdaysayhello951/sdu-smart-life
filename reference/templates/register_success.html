<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册成功！</title>
<script>
function showErrorMessage() {
  alert("注册成功！");
  setTimeout(function() {
    window.location.href = '/login'; // 替换成你的登录页面地址
  }, 100); // 延迟 100 毫秒跳转
}
</script>
</head>
<body onload="showErrorMessage();">
<h1>注册成功！</h1>
<p>注册成功！</p>
</body>
</html>
